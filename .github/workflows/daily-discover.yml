name: Daily Free-Token Discovery

# 每日自动更新：跑 discover 联网发现新渠道 + 重新导出看板/报告，并提交回仓库。
# 由 GitHub 自带的 GITHUB_TOKEN 完成提交与推送，无需额外令牌。
on:
  schedule:
    # 每天 16:00 UTC = 北京时间 次日 00:00
    - cron: '0 16 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

# 赋予 GITHUB_TOKEN 写仓库内容的权限（提交/推送需要）
permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run discovery (联网发现未收录渠道)
        run: python hunter.py discover --top 50

      - name: Regenerate dashboard & reports
        run: python hunter.py export --format all

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily discovery update $(date +%Y-%m-%d)"
            git push
          fi
